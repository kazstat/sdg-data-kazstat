6-5-1: '1. Опрос содержит 32 вопроса, разделенных на четыре основных компонента. 2. Каждому вопросу присваивается оценка от 0 до 100 с шагом в 10 баллов по следующим 6 основным категориям: • Очень низкий (0) • Низкий (20) • Средне-низкий (40) • Средне-высокий (60) • Высокий (80) • Очень высокий (100) Для каждого порога для каждого вопроса даются указания для обеспечения объективных и сопоставимых результатов. 3. Средневзвешенное значение количества вопросов в каждом из четырех компонентов рассчитывается так, чтобы оценка каждого компонента составляла 0-100. 4. Оценки компонентов усредняются (не взвешиваются), чтобы получить балл показателя, выраженный в процентах между 0 и 100.'
6-5-2: 'Показатель рассчитывается по 5–ти шагам: 1. Определение трансграничных поверхностных вод и водоносных горизонтов; 2. Рассчитывается площадь поверхности каждого трансграничного бассейна и общую сумму площади; 3. Рассматривается существующий механизм трансграничного сотрудничества в области управления водными ресурсами и проверка трансграничных вод, охваченных механизмом сотрудничества. 4. Проверяется, какие из существующих механизмов трансграничного сотрудничества в области управления водными ресурсами эксплуатационные. 5. Вычисляется значение показателя, то есть долю области, добавив площадь поверхности в стране тех трансграничных поверхностных водных бассейнов или водоносных горизонтов, которые охвачены оперативным сотрудничеством и разделив его на общую суммарную площадь в стране всех трансграничных бассейнов (включая водоносные горизонты), умноженное на 100, чтобы получить процентную долю.'
