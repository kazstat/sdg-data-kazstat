5-2-1-1: 'Для расчета правонарушений, совершенных в отношении женщин в семейно-бытовой сфере к 2020 году на 20% и к 2023 году на 30% необходимо брать статистические данные 2016 года как базовый показатель (0%) и от него считать ежегодное снижение на 5%. Индикатор рассчитываются по следующей формуле: (RE/BE)*100-100=TI RE – количество преступлений совершенных в отношении женщин (против личности) за отчетный год; BE - количество преступлений совершенных в отношении женщин (против личности) за базовый год; TI – показатель целевого индикатора (%).'
5-2-1-2: 'Для расчета количество правонарушений, совершенных в отношении несовершеннолетних в семейно-бытовой сфере к 2020 году на 20% и к 2023 году на 30% необходимо брать статистические данные 2016 года как базовый показатель (0%) и от него считать ежегодное снижение на 5%. Индикатор рассчитываются по следующей формуле: Индикатор «количество правонарушений, совершенных в отношении несовершеннолетних в семейно-бытовой сфере» рассчитываются по следующей формуле а: (RE/BE)*100-100=TI RE – количество правонарушении совершенных в отношении несовершеннолетних  за отчетный год; BE - количество правонарушении совершенных в отношении несовершеннолетних за базовый год; TI – показатель целевого индикатора (%).'
