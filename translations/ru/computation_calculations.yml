8-8-1: 'Показатель «Уровень производственного травматизма (Кч /1000 работающих)» – это соотношение общего количества пострадавших к числу наемных работников и производится по следующей формуле: Кч =  Т х 1000 / P ,  где: Кч – коэффициент частоты несчастных случаев на 1000 работающих; Т – общее число пострадавших за определенный период времени; Р – численность наемных работников за этот период времени. Периодичность – ежеквартальная'
8-8-2: 'Метод расчета:	Показатель «Удельный вес активных юридических лиц, охваченных системой обязательного страхования работника от несчастных случаев, за исключением государственных учреждений» рассчитывается по следующей формуле: А = B / C  х 100%, где: А - удельный вес активных юридических лиц, охваченных системой обязательного страхования работника от несчастных случаев, за исключением государственных учреждений; В - количество действующих договоров обязательного страхования работника от несчастных случаев (данные Национального банка РК); С - количество активных юридических лиц, за исключением государственных учреждений (данные Бюро национальной статистики). Единица измерения – процент. Периодичность – годовая.'
