8-10-1: 'Показатели рассчитываются на основе данных, полученных непосредственно от Агентства РК по регулированию и развитию финансового рынка, Национального Банка РК и Бюро национальной статистики Агентства по стратегическому планированию и реформам РК. Формула для получения этих показателей такова:〖Количество отделений коммерческих банков на 100 000 взрослых 〗_it =〖Количество филиалов коммерческих банков〗_it/(〖Взрослое население〗_it/100,000) Количество банкоматов на 100 000 взрослых=〖Количество банкоматов〗_it/(〖Взрослое население〗_it/100,000) Где “i” обозначает страну, а “t” - год.'
