6-5-2: 'Доля трансграничных водных бассейнов, охваченных действующими договоренностями о сотрудничестве в области водопользования определяется как доля площади трансграничных водных бассейнов внутри страны, охваченных действующими договоренностями о сотрудничестве в области водопользования.
Он получен как отношение суммы площади поверхностей тех трансграничных поверхностей водосборных бассейнов и трансграничных водоносных горизонтов (т.е. «трансграничные» бассейны) в стране, которые охвачены действующими договоренностями о сотрудничестве в области водопользования, к общей площади всех трансграничных бассейнов (как водосборных бассейнов, так и водоносных горизонтов) в стране. Результат умножается на 100, чтобы получить выражение в процентах.'
