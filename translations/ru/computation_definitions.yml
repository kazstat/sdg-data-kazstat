11-2-1-1: 'В соответствии с Законом РК «Об автомобильных дорогах» от 17 июля 2001 года № 245.
Дороги Республики Казахстан подразделяются на автомобильные дороги общего пользования, а также на улицы населенных пунктов.
Дороги общего пользования по своему значению подразделяются на автомобильные дороги международного, республиканского, областного и районного значения. 
МТ РК ведет реализацию государственной политики в сфере автомобильных дорог и дорожной деятельности, что подразумевает собой разработку и утверждение правил реализации и финансирования работ по строительству, реконструкций, ремонту, содержанию, диагностике, паспортизации и инструментальному обследованию дорог международного и республиканского значения.
По дорогам областного и районного значения согласно «Бюджетного кодекса РК» МТ РК выделяет целевые трансферты на строительство, реконструкцию и ремонт дорог.
По улицам населенных пунктов Министерство выделяет целевые трансферты только на строительство новых дорог в городах республиканского значения (Астана, Алматы и Шымкент).'
