5-5-1: 'Доля мест, занимаемых женщинами в (а) национальных парламентах, по состоянию на 1 февраля отчетного года, в настоящее время измеряется как количество мест, занимаемых женщинами членами парламента в однопалатном парламенте или на нижнем уровне двухпалатного парламента, выраженное в процентах от всех занятых мест.
Национальные парламенты могут быть двухпалатными или однопалатными. В данном случае показатель охватывает одну палату в однопалатном парламенте и нижнюю палату в двухпалатных парламентах. При этом показатель не охватывает верхнюю палату двухпалатных парламентов. Места, обычно, выигрываются членами на всеобщих парламентских выборах. Также места могут распределяться путем назначения, косвенных выборов, ротации членов или через дополнительные выборы.
Места относятся к числу парламентских мандатов или количеству членов парламента.
Доля мест, занимаемых женщинами в местных органах власти, также измеряется в процентах от всех занятых мест в результате выборов.'
